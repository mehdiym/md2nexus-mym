[package]
name = "md2nexus-mym"
version = "0.3.0"
edition = "2021"
authors = ["C J Silverio <ceejceej@gmail.com>", "Mehdi Yousfi-Monod"]
description = "md2nexus - mym Edit: a command-line tool to convert gfm markdown to NexusMods-flavored bbcode."
readme = "README.md"
license = "GPL-3.0"
categories = ["command-line-utilities"]
keywords = ["cli", "markdown", "bbcode"]
repository = "https://github.com/mehdiym/md2nexus-mym"
homepage = "https://github.com/mehdiym/md2nexus-mym"

[[bin]]
name = "md2nexus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.75"
clap = { version = "4.4.2", features = ["derive", "color", "cargo", "wrap_help"] }
clap_complete = "4.4.1"
markdown = "1.0.0-alpha.12"
owo-colors = "3.5.0"

[profile.release]
lto = "thin"
