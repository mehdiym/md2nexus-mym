# On a version tag, creates the GitHub release and attaches an archive of the executable for
# each platform below, with the README, the changelog and the license.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # platform names the archive, for those downloading it: Rust's target triples are less
        # readable (x86_64-unknown-linux-gnu, where unknown is the vendor field).
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            os: windows-latest
          - target: x86_64-apple-darwin
            platform: macos-x86_64
            os: macos-latest
          - target: aarch64-apple-darwin
            platform: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="md2nexus-mym-${{ github.ref_name }}-${{ matrix.platform }}"
          mkdir "$name"
          cp README.md CHANGELOG.md LICENSE "$name"/
          # Zip on every platform: Nexus takes no tar.gz. Info-ZIP's zip keeps the executable bit,
          # which unzip restores; the Windows runner has 7z but no zip.
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/md2nexus.exe" "$name"/
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/md2nexus" "$name"/
            zip -qr "$name.zip" "$name"
          fi
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$ASSET"
